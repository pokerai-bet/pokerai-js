{"openapi":"3.0.3","info":{"title":"pokerai.bet API (GTO strategy + Poker engine)","version":"1.0","description":"GTO strategy API for preflop / flop / turn / river. Returns each action's mixed frequency (no recommended action — you choose by frequency). Preflop and flop tap a library of presolved GTO solutions, served instantly (millisecond). The solver endpoint computes in real time (flop ~70s, turn/river faster). Card/board inputs use a no-separator string (\"2c2h2s\", \"AdKd\"); board is returned as an array ([\"2c\",\"2h\",\"2s\"]). Range strings are comma-separated `hand:weight` (class notation AA/AKs/AKo; weight 0..1, default 1).\n\n⚠ Note: the \"Test Request\" button below sends a real request with your key and consumes your real monthly quota. New here? Read the guide first: https://pokerai.bet/docs\n"},"servers":[{"url":"https://pokerai.bet"}],"security":[{"BearerApiKey":[]},{"XApiKey":[]}],"tags":[{"name":"Lookup","description":"Presolved GTO solutions, served instantly (millisecond) — preflop + the full flop decision tree. Charges 1 presolved quota each."},{"name":"Solver","description":"Real-time solver (flop ~70s, turn/river faster). schedule -> tree -> node."},{"name":"Range","description":"Update ranges along an action line (range conversion / flop projected range)."}],"paths":{"/v1/gto/preflop":{"post":{"tags":["Lookup"],"operationId":"preflopStrategy","summary":"Preflop strategy (presolved)","description":"Charges 1 presolved quota. The situation (RFI/Limp/Raise/3-Bet/4-Bet/5-Bet) is derived from the actions.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PreflopRequest"},"example":{"hole_cards":"AhKh","positions":{"hero":"MP"},"preflop_version":"6max","preflop_actions":[{"position":"SB","action":"small blind","amount":0.5},{"position":"BB","action":"big blind","amount":1},{"position":"UTG","action":"raise","amount":3}]}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PreflopResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"429":{"$ref":"#/components/responses/QuotaExceeded"}}}},"/v1/gto/preflop/range":{"post":{"tags":["Lookup"],"operationId":"preflopRange","summary":"Whole preflop range for a spot (presolved)","description":"The full 13×13 preflop range for a position + action line in one call — 169 hand types →\nfold/call/raise frequencies. No `hole_cards` (the spot comes from positions +\npreflop_actions). Charges 1 presolved quota (one call, not 169). For a range grid.\n\nSet `include_flop_pruning_guarantees: true` to read an offline immutable manifest for a completed Flop batch; this is not a live Flop or database query and there is no `flop_context`. The three statuses are `complete`, `incomplete_coverage`, and `awaiting_terminal_preflop_action`. `always_removed` is conservative: it proves zero weight only across every compatible canonical board in that one terminal scenario. It does not replace the board-specific effective range from POST /v1/gto/flop/tree.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["table_size","positions","preflop_actions"],"properties":{"table_size":{"type":"string","example":"6max"},"preflop_version":{"type":"string","enum":["6max","6max_RC_100bb_200NL","6max_RC_100bb_100NL","6max_RC_40bb"],"description":"optional; which 6max preflop chart set to use (same as /v1/gto/preflop). Omit for the default."},"include_flop_pruning_guarantees":{"type":"boolean","description":"optional; when true, include the offline immutable Flop-batch pruning manifest guarantee. Omit to preserve the existing response shape."},"flop_version":{"type":"string","description":"optional Flop dataset version for the guarantee lookup; there is no flop_context."},"positions":{"type":"object","properties":{"hero":{"type":"string","example":"BTN"}}},"preflop_actions":{"type":"array","items":{"type":"object"},"description":"full action sequence from SB/BB, same as /v1/gto/preflop"}}},"example":{"table_size":"6max","preflop_version":"6max","positions":{"hero":"BTN"},"preflop_actions":[{"position":"SB","action":"small blind","amount":0.5},{"position":"BB","action":"big blind","amount":1}]}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object","properties":{"range":{"type":"object","description":"hand type (AA / AKs / AKo) -> {fold, call, raise}; 169 entries, each summing to ~1","additionalProperties":{"type":"object","properties":{"fold":{"type":"number"},"call":{"type":"number"},"raise":{"type":"number"}}}},"flop_pruning_guarantees":{"type":"object","description":"Present only when include_flop_pruning_guarantees was requested. Missing data must not be used to infer a removal list.","properties":{"status":{"type":"string","enum":["complete","incomplete_coverage","awaiting_terminal_preflop_action"]},"basis":{"type":"string","enum":["served_artifacts"]},"flop_version":{"type":"string"},"manifest_version":{"type":"string"},"continuation":{"oneOf":[{"type":"object","properties":{"action":{"type":"string"},"scenario":{"type":"object","properties":{"preflop_type":{"type":"string","enum":["SRP"]},"raiser":{"type":"string"},"caller":{"type":"string"}}},"canonical_board_count":{"type":"integer"},"ranges":{"type":"object","additionalProperties":{"type":"object","properties":{"source_action":{"type":"string"},"position":{"type":"string"},"always_removed":{"type":"array","items":{"type":"string"}}}}}}},{"type":"null"}]}}},"quota":{"type":"object","properties":{"used":{"type":"integer"},"limit":{"type":"integer"}}}}},"example":{"range":{"AA":{"fold":0,"call":0,"raise":1},"AKs":{"fold":0,"call":0,"raise":1},"72o":{"fold":1,"call":0,"raise":0}},"quota":{"used":7,"limit":100}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"404":{"$ref":"#/components/responses/NoSolution"},"429":{"$ref":"#/components/responses/QuotaExceeded"}}}},"/v1/gto/preflop/versions":{"get":{"tags":["Lookup"],"operationId":"preflopVersions","summary":"List installed preflop strategy versions (free)","description":"The selectable preflop_version values for /v1/gto/preflop and /v1/gto/preflop/range, with a human label for each and which one is the default (used when preflop_version is omitted). Free (no quota). Use this instead of hardcoding the list — new versions appear here automatically.\n","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object","properties":{"versions":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string","description":"pass this as preflop_version"},"label":{"type":"string"},"default":{"type":"boolean","description":"present and true on the default version"}}}},"default":{"type":"string","description":"the id used when preflop_version is omitted"}}},"example":{"versions":[{"id":"6max","label":"6 max 100bb Deepsolver","default":true},{"id":"6max_RC_100bb_200NL","label":"6 max 100bb GG 200NL 3b/f 2.2x - 2.5x"},{"id":"6max_RC_100bb_100NL","label":"6 max 100bb GG 100NL 3b/f"},{"id":"6max_RC_40bb","label":"6 max 40bb GG 100NL"}],"default":"6max"}}}},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/v1/gto/flop/tree":{"post":{"tags":["Lookup"],"operationId":"flopTree","summary":"Flop decision tree (presolved)","description":"Charges 1 presolved quota. Returns starting ranges + all decision nodes (each with a token for /v1/gto/flop/node). Top-level oop_range and ip_range are the effective aliases consumed by the strategy tree; use ranges.effective, never ranges.requested, for range conversion. policy_audit_status=mismatch means a historical effective range differs from current policy, not that the artifact and range disagree. Missing policy configuration fails closed.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/FlopTreeRequest"},"examples":{"SRP":{"summary":"Single-raised pot — positions: hero, raiser, caller","value":{"board":"2c2h2s","pot_type":"SRP","positions":{"hero":"UTG","raiser":"UTG","caller":"BTN"}}},"3BET":{"summary":"3-bet pot — positions: hero, raiser (opener), three_bettor","value":{"board":"2c2h2s","pot_type":"3BET","positions":{"hero":"CO","raiser":"CO","three_bettor":"BTN"}}},"4BET":{"summary":"4-bet pot — positions: hero, raiser (opener who 4-bet), three_bettor (3-bettor who called)","value":{"board":"2c2h2s","pot_type":"4BET","positions":{"hero":"CO","raiser":"CO","three_bettor":"BTN"}}},"LIMP":{"summary":"Limped pot — positions: hero, limper (hero or limper must be BB)","value":{"board":"2c2h2s","pot_type":"LIMP","positions":{"hero":"BB","limper":"BTN"}}}}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/FlopTreeResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"404":{"$ref":"#/components/responses/NoSolution"},"429":{"$ref":"#/components/responses/QuotaExceeded"}}}},"/v1/gto/flop/node":{"post":{"tags":["Lookup"],"operationId":"flopNode","summary":"Flop node strategy (presolved) — one decision-tree node","description":"Per-node strategy for the flop decision tree (free, token-gated). Pass a `node` token minted by POST /v1/gto/flop/tree. With hole_cards → that hand's mixed strategy at the node; omit hole_cards → the node's whole-range strategy.\n\nThis is how you get EVERY hero flop decision — hero in position, hero facing a bet, or a later action: fetch the tree, pick a node where is_hero is true (e.g. root/CHECK/BET_13 = hero faces a bet after checking → fold/call/raise), and pass its token here. The root node (root) is hero's first decision (OOP check/bet).\n\nIf requested hole_cards were removed from the tree's effective range, this endpoint returns terminal HTTP 422 hand_not_in_effective_range; do not retry it and do not describe it as 404. The flop tree is single-street; for turn/river decisions use the solver line (/v1/gto/solver/*).\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/FlopNodeRequest"},"example":{"node":"eyJ...<token from /v1/gto/flop/tree>","hole_cards":"AdKd"}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NodeStrategyResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NoSolution"},"422":{"description":"hole_cards were removed from this flop tree's effective range; terminal, do not retry","content":{"application/json":{"schema":{"type":"object","required":["error","message"],"properties":{"error":{"type":"string","enum":["hand_not_in_effective_range"]},"message":{"type":"string"}}},"example":{"error":"hand_not_in_effective_range","message":"hole_cards were removed from this flop tree's effective range"}}}}}}},"/v1/gto/solver":{"post":{"tags":["Solver"],"operationId":"solverSchedule","summary":"Schedule a real-time solve (flop/turn/river)","description":"board length sets the street (3=flop, 4=turn, 5=river). Charges 1 solve quota on a fresh trigger; a cached solve returns status=queryable with no solve_quota field (not charged); all solver hosts busy returns 429 status=busy.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SolverScheduleRequest"},"example":{"board":"2c2h2s9d","oop_range":"AA,KK,QQ,AKs","ip_range":"JJ,TT,AQs,KQs","pot":20,"effective_stack":90,"hero":"OOP","bet_sizes":{"turn":[67],"river":[75]},"raise_sizes":{"turn":[80],"river":[125]},"donk_sizes":{"turn":[55],"river":[90]},"raise_limit":3}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SolverScheduleResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"429":{"description":"solve quota exceeded, or all solver hosts busy (status=busy)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}},"/v1/gto/solver/tree":{"post":{"tags":["Solver"],"operationId":"solverTree","summary":"Poll the solve tree + node status (free)","description":"Poll until spot_status = queryable. To advance a multi-street solve to the dealt runout, pass\nthe dealt cards: `turn_card` (e.g. a flop solve → a specific turn), and/or `river_card`.\nA river spot from a *flop* solve needs BOTH `turn_card` and `river_card` to be unique;\na turn solve needs only `river_card`. Omit both to get the solve's own street.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["solve"],"properties":{"solve":{"type":"string","description":"handle from /v1/gto/solver"},"turn_card":{"type":"string","description":"optional; for a flop solve, the dealt turn card (e.g. \"Td\") — returns nodes under that turn."},"river_card":{"type":"string","description":"optional; the dealt river card (e.g. \"Qh\"). From a flop solve, pair with turn_card to disambiguate."}}},"example":{"solve":"eyJ0Ijoic2x2X3h4eXoi...(handle from /v1/gto/solver)","turn_card":"Td","river_card":"Qh"}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SolverTreeResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/v1/gto/solver/node":{"post":{"tags":["Solver"],"operationId":"solverNode","summary":"Node strategy from a solve (free)","description":"hero node → hero strategy; villain node (or omit hole_cards) → whole-range strategy.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["node"],"properties":{"node":{"type":"string","description":"node token from /v1/gto/solver/tree"},"hole_cards":{"$ref":"#/components/schemas/HoleCards"}}},"example":{"node":"eyJ0Ijoic2x2X3h4eXoi...(token from /v1/gto/solver/tree)","hole_cards":"AhKh"}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/NodeStrategyResponse"},{"type":"object","properties":{"node_status":{"type":"string","enum":["available","computing","queryable","expired","error"],"description":"expired = solve reclaimed/replaced, reschedule; error = solver per-node strategy_error (with message); computing = still solving."},"message":{"type":"string","description":"present on node_status = error"}}}]}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/v1/gto/solver/release":{"post":{"tags":["Solver"],"operationId":"solverRelease","summary":"Release a solve's pool port early (free, optional)","description":"Signal you are done querying this solve so its solver port returns to the pool immediately\ninstead of lingering the cache TTL (which can 429-busy the next request when the pool is small).\nOptional — skipping it just falls back to the TTL. Call it only AFTER your last\n/v1/gto/solver/tree and /v1/gto/solver/node for this solve: once released the port may be\nreused, and further queries on this handle return node_status = expired. Idempotent; does not\nrestart the solver.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["solve"],"properties":{"solve":{"type":"string","description":"handle from /v1/gto/solver"}}},"example":{"solve":"eyJ0Ijoic2x2X3h4eXoi...(handle from /v1/gto/solver)"}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object","properties":{"released":{"type":"boolean","description":"true if a live port claim was dropped; false if the solve had already expired (no-op)"}}},"example":{"released":true}}}},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/v1/gto/range":{"post":{"tags":["Range"],"operationId":"rangeConvert","summary":"Range conversion — update ranges along an action line","description":"Thin proxy to the solver's /api/range. You assemble all inputs including solver_results (the decision tree). Charges 1 presolved quota. Output ranges feed the next street's solve.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RangeRequest"},"example":{"range_oop":"AA,KK,QQ,JJ,AKs","range_ip":"TT,99,AQs,KQs,JTs","board":"2c2h2s","node_id":"root/CHECK/BET 8.000000","solver_results":{"node_type":"action_node","player":1,"strategy":{"actions":["CHECK","BET 8.000000"],"strategy":{"AsAh":[0.6,0.4]}},"childrens":{"CHECK":{"node_type":"action_node","player":0,"strategy":{"actions":["CHECK","BET 8.000000"],"strategy":{"KsKh":[0.5,0.5]}},"childrens":{"BET 8.000000":{"node_type":"action_node","player":1,"strategy":{"actions":["FOLD","CALL","RAISE 18.000000"],"strategy":{"QsQh":[0.2,0.5,0.3]}},"childrens":{}}}}}}}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RangeResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"429":{"$ref":"#/components/responses/QuotaExceeded"},"502":{"$ref":"#/components/responses/Upstream"}}}},"/v1/gto/flop/projected-range":{"post":{"tags":["Range"],"operationId":"projectedRange","summary":"Projected range — flop range update along an action line (presolved quota)","description":"Projects the flop ranges forward along an action line for the given board / pot_type / positions. Charges 1 presolved quota. Returns the same range-update output as /v1/gto/range.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ProjectedRangeRequest"},"example":{"board":"2c2h2s","pot_type":"SRP","positions":{"hero":"UTG","raiser":"UTG","caller":"BTN"},"node_id":"root/BET_4","normalize":true,"bluff_discount_ratio":0.8,"bluff_combos_ratio":0.5,"hero_position":"oop","hero_hand":"AsKs","partner_hands":["Ac9c"]}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ProjectedRangeResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"404":{"$ref":"#/components/responses/NoSolution"},"429":{"$ref":"#/components/responses/QuotaExceeded"}}}},"/v1/gto/evs":{"post":{"tags":["Range"],"operationId":"queryEvs","summary":"Node EVs — per-hand, per-action expected values of a completed solve (free)","description":"Per-hand, per-action expected values at one node of a completed solve. Give the solve handle (from /v1/gto/solver) + a node_id (from /v1/gto/solver/tree); optional hand filters to one hand. Free (already charged via /v1/gto/solver). Poll /v1/gto/solver/tree until queryable first.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EvsRequest"},"example":{"solve":"eyJ0Ijoic2x2X3h4eXoi...(handle from /v1/gto/solver)","node_id":"root"}}}},"responses":{"200":{"description":"node EVs; or { spot_status: computing } if not converged yet.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/EvsResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"description":"solve handle invalid or not yours"},"410":{"description":"solve expired (TTL); reschedule via /v1/gto/solver"}}}},"/v1/gto/turn/projected-range":{"post":{"tags":["Range"],"operationId":"turnProjectedRange","summary":"Projected range — turn→river range update along a turn action line (free)","description":"The turn→river analog of /v1/gto/flop/projected-range, for a real-time turn solve. Narrows the entering-turn ranges (the ranges the solve was scheduled with, read from the solve's own config) along a turn action line — including the street-closing CALL/CHECK — to the entering-river ranges. Free (the solve was already charged via /v1/gto/solver), like /v1/gto/solver/tree. Returns the same range-update output as /v1/gto/range. Poll /v1/gto/solver/tree until spot_status = queryable first.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TurnProjectedRangeRequest"},"example":{"solve":"eyJ0Ijoic2x2X3h4eXoi...(handle from /v1/gto/solver)","node_id":"root/CHECK/BET 6.000000/CALL","normalize":true}}}},"responses":{"200":{"description":"narrowed entering-river ranges; or { spot_status: computing } if the solve has not converged yet (keep polling /v1/gto/solver/tree).","content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/RangeResponse"},{"type":"object","properties":{"spot_status":{"type":"string","enum":["computing"]}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"410":{"description":"solve expired (TTL) — reschedule via /v1/gto/solver","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"502":{"$ref":"#/components/responses/Upstream"}}}},"/health":{"get":{"summary":"Health","operationId":"health_health_get","responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{"additionalProperties":true,"type":"object","title":"Response Health Health Get"}}}}}}},"/v1/pokerkit/texture":{"post":{"tags":["Semantic"],"summary":"Texture","operationId":"texture_v1_pokerkit_texture_post","parameters":[{"name":"authorization","in":"header","required":false,"schema":{"type":"string","default":"","title":"Authorization"}},{"name":"x-api-key","in":"header","required":false,"schema":{"type":"string","default":"","title":"X-Api-Key"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BoardRequest"}}}},"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}}}}},"/v1/pokerkit/nuts":{"post":{"tags":["Semantic"],"summary":"Nuts","operationId":"nuts_v1_pokerkit_nuts_post","parameters":[{"name":"authorization","in":"header","required":false,"schema":{"type":"string","default":"","title":"Authorization"}},{"name":"x-api-key","in":"header","required":false,"schema":{"type":"string","default":"","title":"X-Api-Key"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BoardRequest"}}}},"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}}}}},"/v1/pokerkit/category-combos":{"post":{"tags":["Semantic"],"summary":"Category Combos","operationId":"category_combos_v1_pokerkit_category_combos_post","parameters":[{"name":"authorization","in":"header","required":false,"schema":{"type":"string","default":"","title":"Authorization"}},{"name":"x-api-key","in":"header","required":false,"schema":{"type":"string","default":"","title":"X-Api-Key"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BoardRequest"}}}},"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}}}}},"/v1/pokerkit/board-report":{"post":{"tags":["Semantic"],"summary":"Board Report","operationId":"board_report_v1_pokerkit_board_report_post","parameters":[{"name":"authorization","in":"header","required":false,"schema":{"type":"string","default":"","title":"Authorization"}},{"name":"x-api-key","i